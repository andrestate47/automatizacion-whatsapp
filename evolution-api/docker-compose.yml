version: '3.3'

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.2.1
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://147.93.130.148:8080
      - AUTHENTICATION_API_KEY=Robo1234Central!@#
      - DATABASE_PROVIDER=sqlite
      - WEBSOCKET_ENABLED=false
      - WA_BUSINESS_TOKEN_WEBHOOK=robotina
      - WA_BUSINESS_URL=https://graph.facebook.com
      - WA_BUSINESS_VERSION=v21.0
      - WA_BUSINESS_LANGUAGE=es_ES
      - REJECT_CALL=true
      - GROUPS_IGNORE=true
    volumes:
      - ./evolution_instances:/evolution/instances
      - ./evolution_store:/evolution/store
